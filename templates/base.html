<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}TecnoSoporte SAC{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    :root {
      --primary:   #0d6efd;
      --success:   #198754;
      --warning:   #ffc107;
      --danger:    #dc3545;
      --sidebar-w: 220px;
    }
    body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }

    /* ── Navbar ── */
    .navbar { background: #0a2540; }
    .navbar-brand { color: #fff !important; font-weight: 700; font-size: 1.2rem; }
    .navbar-brand span { color: #60a5fa; }

    /* ── Cards ── */
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    .card-header { border-radius: 12px 12px 0 0 !important; font-weight: 600; }

    /* ── Estado badges ── */
    .badge-pendiente  { background: #fff3cd; color: #856404;  border: 1px solid #ffc107; }
    .badge-enproceso  { background: #cfe2ff; color: #084298;  border: 1px solid #0d6efd; }
    .badge-resuelto   { background: #d1e7dd; color: #0a3622;  border: 1px solid #198754; }

    /* ── Table ── */
    .table thead th { background: #0a2540; color: #fff; font-size: .85rem; border: none; }
    .table tbody tr:hover { background: #e8f0fe; }

    /* ── Buttons ── */
    .btn-sm { font-size: .78rem; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg px-4 py-3">
  <a class="navbar-brand" href="{{ url_for('index') }}">
    <i class="bi bi-headset me-2"></i>Tecno<span>Soporte</span> SAC
  </a>
  <div class="ms-auto">
    <a href="{{ url_for('nuevo_ticket') }}" class="btn btn-primary btn-sm">
      <i class="bi bi-plus-circle me-1"></i>Nuevo Ticket
    </a>
  </div>
</nav>

<div class="container-fluid py-4 px-4">

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
